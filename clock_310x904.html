<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=310,user-scalable=no">
<title>Elegant Clock 310x904</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Shippori+Mincho:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== 時間帯で自動切替するカラーテーマ（LED視認性重視でコントラスト強め） ===== */
  :root{
    --jp:"Shippori Mincho","Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho",serif;
    --bg1:#fbf8f2; --bg2:#efe6d5; --ink:#1c1b19; --sub:#3f3a33;
    --gold:#8a6830; --deco:#b08a4c; --line:rgba(160,122,62,.9); --accent:#a8302c; --sat:#24497a;
  }
  .t-morning{ --bg1:#f8f6f0; --bg2:#e4eae6; --ink:#16213a; --sub:#34405a; --gold:#8a6830; --deco:#b08a4c; --line:rgba(160,122,62,.9); --accent:#a8302c; --sat:#24497a;}
  .t-day    { --bg1:#fbf8f2; --bg2:#efe6d5; --ink:#1c1b19; --sub:#3f3a33; --gold:#8a6830; --deco:#b08a4c; --line:rgba(160,122,62,.9); --accent:#a8302c; --sat:#24497a;}
  .t-evening{ --bg1:#3b2630; --bg2:#1f1720; --ink:#fff6ec; --sub:#ecdccf; --gold:#f0cc8e; --deco:#e0bb7c; --line:rgba(224,187,124,.9); --accent:#ff9a80; --sat:#b5ccef;}
  .t-night  { --bg1:#17223a; --bg2:#0b111e; --ink:#ffffff; --sub:#dde2ec; --gold:#ecc985; --deco:#d9b676; --line:rgba(217,182,118,.85); --accent:#ff9c90; --sat:#a9c6f2;}

  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%}
  #stage{
    position:absolute;left:0;top:0;width:310px;height:904px;overflow:hidden;
    transform-origin:0 0;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    color:var(--ink);
    font-family:"Cormorant Garamond","Times New Roman",serif;
    font-weight:600;
  }
  .frame{position:absolute;inset:12px;border:3px solid var(--line);pointer-events:none;z-index:5}
  .frame::before{content:"";position:absolute;inset:5px;border:2px solid var(--line);opacity:.6}
  .corner{position:absolute;width:14px;height:14px;background:var(--deco);transform:rotate(45deg);z-index:6}
  .c-t{top:6px;left:148px}.c-b{bottom:6px;left:148px}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         opacity:0;transition:opacity 1.6s ease;}
  .scene.on{opacity:1}

  .greet{font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .greet-jp{font-family:var(--jp);font-size:22px;letter-spacing:.12em;color:var(--sub);margin-top:6px;font-weight:700}
  .num{font-variant-numeric:lining-nums tabular-nums}

  /* --- Scene 1 : Digital --- */
  .d-hh,.d-mm{font-size:180px;line-height:.86;font-weight:700;letter-spacing:-.02em}
  .d-rule{width:200px;height:3px;background:var(--line);margin:24px 0 28px;position:relative}
  .d-sec{position:absolute;left:0;top:-3px;height:9px;background:var(--gold);width:0}
  .d-rule::before,.d-rule::after{content:"";position:absolute;top:-5px;width:12px;height:12px;background:var(--deco);transform:rotate(45deg)}
  .d-rule::before{left:-20px}.d-rule::after{right:-20px}
  .d-week{margin-top:40px;font-size:32px;letter-spacing:.14em;padding-left:.14em;font-weight:700}
  .d-date{font-size:40px;font-style:italic;margin-top:0;font-weight:700}
  .d-jp{font-family:var(--jp);font-size:24px;color:var(--sub);letter-spacing:.04em;margin-top:6px;font-weight:700}

  /* --- Scene 2 : Analog --- */
  .a-svg{width:276px;height:276px;margin:34px 0 34px}
  .a-digi{font-size:72px;font-weight:700;letter-spacing:.02em;line-height:1}
  .a-date{font-size:30px;letter-spacing:.1em;padding-left:.1em;color:var(--sub);margin-top:10px;font-weight:700}

  /* --- Scene 3 : 縦書き --- */
  .v-wrap{display:flex;flex-direction:row-reverse;align-items:stretch;gap:14px;font-family:var(--jp)}
  .v-wrap>*{flex-shrink:0}
  .v-col{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap}
  .v-small{font-size:23px;letter-spacing:.12em;color:var(--sub);font-weight:700}
  .v-big{font-size:96px;letter-spacing:.04em;font-weight:800;line-height:1}
  .v-mid{padding-top:90px}
  .seal{width:50px;height:50px;border:4px solid var(--accent);color:var(--accent);border-radius:5px;
        display:flex;align-items:center;justify-content:center;font-family:var(--jp);font-size:28px;font-weight:800;margin-top:30px}

  /* --- Scene 4 : Calendar --- */
  .c-month{font-size:150px;line-height:.85;font-weight:700}
  .c-month-en{font-size:28px;letter-spacing:.1em;padding-left:.1em;text-transform:uppercase;margin-top:10px;font-weight:700}
  .c-era{font-family:var(--jp);font-size:22px;color:var(--sub);letter-spacing:.1em;margin-top:4px;font-weight:700}
  .c-grid{display:grid;grid-template-columns:repeat(7,37px);gap:0;margin:24px 0 22px}
  .c-grid div{height:38px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700}
  .c-grid .h{font-size:14px;letter-spacing:0;color:var(--sub);height:30px}
  .c-grid .sun{color:var(--accent)} .c-grid .sat{color:var(--sat)}
  .c-grid .today{background:var(--gold);color:var(--bg1);border-radius:50%;width:36px;height:36px;margin:1px auto}
  .c-time{font-size:72px;font-weight:700;letter-spacing:.02em;line-height:1}
  .c-week{font-size:26px;letter-spacing:.12em;padding-left:.12em;color:var(--gold);font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
<div id="stage" class="t-day">
  <div class="frame"></div><div class="corner c-t"></div><div class="corner c-b"></div>

  <!-- Scene 1 : Digital -->
  <section class="scene" id="s-digital">
    <div class="greet js-greet">Good Afternoon</div>
    <div class="greet-jp js-greet-jp">こんにちは</div>
    <div style="height:46px"></div>
    <div class="d-hh num" id="d-hh">00</div>
    <div class="d-rule"><span class="d-sec" id="d-sec"></span></div>
    <div class="d-mm num" id="d-mm">00</div>
    <div class="d-week" id="d-week">FRIDAY</div>
    <div class="d-date num" id="d-date">October 23</div>
    <div class="d-jp num" id="d-jp">2026.10.23（金）</div>
  </section>

  <!-- Scene 2 : Analog -->
  <section class="scene" id="s-analog">
    <div class="greet js-greet">Good Afternoon</div>
    <div class="greet-jp js-greet-jp">こんにちは</div>
    <svg class="a-svg" viewBox="0 0 260 260" aria-hidden="true">
      <circle cx="130" cy="130" r="126" fill="none" stroke="var(--line)" stroke-width="3"/>
      <circle cx="130" cy="130" r="119" fill="none" stroke="var(--line)" stroke-width="1.5" opacity=".6"/>
      <g id="a-ticks"></g>
      <line id="a-h" x1="130" y1="142" x2="130" y2="72" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>
      <line id="a-m" x1="130" y1="146" x2="130" y2="40" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
      <line id="a-s" x1="130" y1="152" x2="130" y2="30" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="130" cy="130" r="9" fill="var(--accent)"/>
      <circle cx="130" cy="130" r="3" fill="var(--bg1)"/>
    </svg>
    <div class="a-digi num" id="a-digi">00:00</div>
    <div class="a-date num" id="a-date">10.23 FRI</div>
  </section>

  <!-- Scene 3 : 縦書き -->
  <section class="scene" id="s-vertical">
    <div class="v-wrap">
      <div class="v-col v-small" id="v-date">令和八年　十月二十三日　金曜日</div>
      <div class="v-col v-big" id="v-time">十五時二十一分</div>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end">
        <div class="seal">時</div>
      </div>
    </div>
  </section>

  <!-- Scene 4 : Calendar -->
  <section class="scene" id="s-calendar">
    <div class="c-month num" id="c-month">10</div>
    <div class="c-month-en" id="c-month-en">October 2026</div>
    <div class="c-era" id="c-era">令和八年</div>
    <div class="c-grid num" id="c-grid"></div>
    <div class="c-week" id="c-week">FRIDAY</div>
    <div class="c-time num" id="c-time">00:00</div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var W=310,H=904;
  var q=new URLSearchParams(location.search);
  var INTERVAL=Math.max(5,parseInt(q.get("interval")||"15",10))*1000; // 切替秒数
  var FIX=q.get("scene");          // digital / analog / vertical / calendar で固定
  var THEME=q.get("theme");        // morning / day / evening / night で固定

  var $=function(id){return document.getElementById(id)};
  var stage=$("stage");

  /* --- 画面サイズに合わせて拡大縮小（比率維持・中央寄せ） ---
     ?fit=0      … 拡大縮小しない（左上に310×904で固定）
     ?scale=0.8  … 倍率を手動指定
     ?debug=1    … 画面サイズ情報を表示 */
  var FIT=q.get("fit")!=="0";
  var MANUAL=parseFloat(q.get("scale")||"");
  var DEBUG=q.get("debug")==="1";
  var dbg=null;
  if(DEBUG){
    dbg=document.createElement("div");
    dbg.style.cssText="position:fixed;left:0;top:0;z-index:99;background:rgba(0,0,0,.8);color:#0f0;font:12px monospace;padding:4px;white-space:pre";
    document.body.appendChild(dbg);
  }
  function viewSize(){
    var de=document.documentElement;
    var w=de.clientWidth||innerWidth||W, h=de.clientHeight||innerHeight||H;
    return [w,h];
  }
  function fit(){
    var v=viewSize(), vw=v[0], vh=v[1], s=1, x=0, y=0;
    if(MANUAL>0){ s=MANUAL; }
    else if(FIT && vw>0 && vh>0){
      s=Math.min(vw/W, vh/H);
      x=Math.max(0,(vw-W*s)/2); y=Math.max(0,(vh-H*s)/2);
    }
    stage.style.transform="translate("+x+"px,"+y+"px) scale("+s+")";
    if(dbg) dbg.textContent="inner "+innerWidth+"x"+innerHeight+"\nclient "+vw+"x"+vh+"\nscreen "+screen.width+"x"+screen.height+"\ndpr "+devicePixelRatio+"\nscale "+s.toFixed(3);
  }
  addEventListener("resize",fit);
  addEventListener("load",fit);
  fit();
  setInterval(fit,1000); // プレーヤーが後から枠サイズを変える場合に追従

  /* --- 定数 --- */
  var WEEK_EN=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  var WEEK_SH=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var WEEK_JP=["日","月","火","水","木","金","土"];
  var MON_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var KD=["〇","一","二","三","四","五","六","七","八","九"];
  function kan(n){
    if(n===0) return "零";
    var t=Math.floor(n/10),o=n%10,s="";
    if(t>1) s+=KD[t];
    if(t>=1) s+="十";
    if(o>0) s+=KD[o];
    return s;
  }
  function pad(n){return (n<10?"0":"")+n}
  function reiwa(y){var r=y-2018;return r===1?"元":kan(r)}
  function set(el,v){ if(el && el.textContent!==v) el.textContent=v; }

  /* --- アナログ目盛り --- */
  (function(){
    var g=$("a-ticks"),ns="http://www.w3.org/2000/svg";
    for(var i=0;i<60;i++){
      var major=i%5===0, a=i*6*Math.PI/180;
      var r1=i%15===0?92:(major?100:108), r2=114;
      var l=document.createElementNS(ns,"line");
      l.setAttribute("x1",130+r1*Math.sin(a)); l.setAttribute("y1",130-r1*Math.cos(a));
      l.setAttribute("x2",130+r2*Math.sin(a)); l.setAttribute("y2",130-r2*Math.cos(a));
      l.setAttribute("stroke",major?"var(--ink)":"var(--line)");
      l.setAttribute("stroke-width",i%15===0?7:(major?4:2));
      g.appendChild(l);
    }
  })();

  /* --- 時間帯テーマ --- */
  function themeFor(h){
    if(THEME) return THEME;
    if(h>=5&&h<10) return "morning";
    if(h>=10&&h<17) return "day";
    if(h>=17&&h<20) return "evening";
    return "night";
  }
  function greetFor(h){
    if(h>=5&&h<11) return ["Good Morning","おはようございます"];
    if(h>=11&&h<17) return ["Good Afternoon","こんにちは"];
    return ["Good Evening","こんばんは"];
  }

  /* --- カレンダー --- */
  var calKey="";
  function renderCal(d){
    var y=d.getFullYear(),m=d.getMonth(),today=d.getDate();
    var key=y+"-"+m+"-"+today; if(key===calKey) return; calKey=key;
    var g=$("c-grid"),html="";
    for(var i=0;i<7;i++) html+='<div class="h '+(i===0?"sun":i===6?"sat":"")+'">'+WEEK_SH[i]+'</div>';
    var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    for(i=0;i<first;i++) html+="<div></div>";
    for(var dd=1;dd<=days;dd++){
      var w=(first+dd-1)%7, c=[];
      if(w===0)c.push("sun"); if(w===6)c.push("sat"); if(dd===today)c.push("today");
      html+='<div class="'+c.join(" ")+'">'+dd+"</div>";
    }
    g.innerHTML=html;
  }

  /* --- 毎秒の表示更新 --- */
  var lastSec=-1, greetEls=document.querySelectorAll(".js-greet"), greetJpEls=document.querySelectorAll(".js-greet-jp");
  function update(d){
    var h=d.getHours(),mi=d.getMinutes(),s=d.getSeconds(),y=d.getFullYear(),mo=d.getMonth(),da=d.getDate(),w=d.getDay();

    var th="t-"+themeFor(h); if(stage.className!==th) stage.className=th;
    var g=greetFor(h);
    for(var i=0;i<greetEls.length;i++){ set(greetEls[i],g[0]); set(greetJpEls[i],g[1]); }

    // Digital
    set($("d-hh"),pad(h)); set($("d-mm"),pad(mi));
    set($("d-week"),WEEK_EN[w]); set($("d-date"),MON_EN[mo]+" "+da);
    set($("d-jp"),y+"."+pad(mo+1)+"."+pad(da)+"（"+WEEK_JP[w]+"）");
    var bar=$("d-sec");
    if(s===0){ bar.style.transition="none"; bar.style.width="0"; void bar.offsetWidth; }
    else { bar.style.transition="width 1s linear"; bar.style.width=(s/59*100)+"%"; }

    // Analog
    set($("a-digi"),pad(h)+":"+pad(mi));
    set($("a-date"),pad(mo+1)+"."+pad(da)+" "+WEEK_SH[w]);

    // 縦書き
    set($("v-date"),"令和"+reiwa(y)+"年　"+kan(mo+1)+"月"+kan(da)+"日　"+WEEK_JP[w]+"曜日");
    var vt=kan(h)+"時"+(mi===0?"丁度":kan(mi)+"分");
    var vEl=$("v-time");
    if(vEl.textContent!==vt){
      vEl.textContent=vt;
      // 文字数に合わせて枠いっぱいの大きさに（最大116px）
      vEl.style.fontSize=Math.min(116,Math.floor(780/(vt.length*1.04)))+"px";
    }

    // Calendar
    set($("c-month"),String(mo+1)); set($("c-month-en"),MON_EN[mo]+" "+y);
    set($("c-era"),"令和"+reiwa(y)+"年"); set($("c-week"),WEEK_EN[w]);
    set($("c-time"),pad(h)+":"+pad(mi));
    renderCal(d);
  }

  /* --- アナログ針（なめらか秒針） --- */
  var aH=$("a-h"),aM=$("a-m"),aS=$("a-s");
  function frame(){
    var d=new Date(), ms=d.getMilliseconds(), s=d.getSeconds()+ms/1000, m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
    aS.setAttribute("transform","rotate("+(s*6)+" 130 130)");
    aM.setAttribute("transform","rotate("+(m*6)+" 130 130)");
    aH.setAttribute("transform","rotate("+(h*30)+" 130 130)");
    if(d.getSeconds()!==lastSec){ lastSec=d.getSeconds(); update(d); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* --- シーン切替 --- */
  var order=["digital","analog","vertical","calendar"];
  var scenes=order.map(function(n){return $("s-"+n)});
  var idx=FIX&&order.indexOf(FIX)>=0?order.indexOf(FIX):0;
  scenes[idx].classList.add("on");
  if(!FIX){
    setInterval(function(){
      scenes[idx].classList.remove("on");
      idx=(idx+1)%scenes.length;
      scenes[idx].classList.add("on");
    },INTERVAL);
  }
})();
</script>
</body>
</html>
